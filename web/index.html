<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root,
    change the href value below to reflect the base path you are
    serving from.

    The path provided below has to start and end with a slash "/" in
    order for it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the
    value of the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Virtual Twin - AI Fashion Try-On App">

  <!-- Google Sign-In Client ID -->
  <!-- 
    ⚠️ IMPORTANT: Replace YOUR_GOOGLE_CLIENT_ID with your actual Client ID
    
    To get your Client ID:
    1. Go to: https://console.firebase.google.com/project/ai-styling-c45cf/authentication/providers
    2. Enable Google Sign-In provider
    3. Copy the Web client ID (looks like: 123456789-xxxxx.apps.googleusercontent.com)
    4. Replace YOUR_GOOGLE_CLIENT_ID below with your actual Client ID
    
    OR get it from:
    https://console.cloud.google.com/apis/credentials?project=ai-styling-c45cf
    
    See GOOGLE_SIGNIN_SETUP.md for detailed instructions
  -->
  <meta name="google-signin-client_id" content="102834305158-oh2sl7huahdeg6p1cr7601iaj0on51dj.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Virtual Twin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Virtual Twin</title>
  <link rel="manifest" href="manifest.json">

  <!-- Firebase Web SDK - MUST load before Flutter -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
  <script>
    // Post Look uses Supabase for images; feed metadata (likes, comments) still uses Firestore.
    // Reduce Firestore SDK log noise (transport / WebChannel warnings when network is flaky).
    if (typeof firebase !== 'undefined' && firebase.firestore && firebase.firestore.setLogLevel) {
      firebase.firestore.setLogLevel('error');
    }
  </script>
  
  <script>
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <div id="loading" style="display:flex;align-items:center;justify-content:center;height:100vh;background:#FFFFFF;">
    <img src="assets/images/cleologo.jpg" alt="Logo" style="width:120px;height:120px;border-radius:20px;opacity:0.9;animation:breath 2s ease-in-out infinite;" onerror="this.style.display='none'">
  </div>
  <style>
    @keyframes breath {
      0%, 100% { transform: scale(0.96); opacity: 0.85; }
      50% { transform: scale(1.0); opacity: 1.0; }
    }
  </style>
  <script>
    // Standard Flutter web bootstrap (ensures _flutter.buildConfig is set)
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            document.getElementById('loading').style.display = 'none';
            appRunner.runApp();
          }).catch(function(error) {
            console.error('Error initializing Flutter app:', error);
            document.getElementById('loading').innerHTML = '<div style="text-align:center;"><h1 style="color:#EF4444;">Error Loading App</h1><p>Please check the browser console for details.</p><p style="color:red;">' + error.toString() + '</p></div>';
          });
        }
      });
    });

    // Fallback error handler
    window.addEventListener('error', function(ev) {
      console.error('Global error:', ev.error);
    });
  </script>
</body>
</html>
