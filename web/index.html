<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root,
    change the href value below to reflect the base path you are
    serving from.

    The path provided below has to start and end with a slash "/" in
    order for it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the
    value of the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Virtual Twin - AI Fashion Try-On App">

  <!-- Google Sign-In Client ID (replace with your actual client ID from Google Cloud Console) -->
  <meta name="google-signin-client_id" content="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Virtual Twin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Virtual Twin</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    // Standard Flutter web bootstrap (ensures _flutter.buildConfig is set)
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          }).catch(function(error) {
            console.error('Error initializing Flutter app:', error);
            document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:Arial,sans-serif;"><div style="text-align:center;"><h1>Error Loading App</h1><p>Please check the browser console for details.</p><p style="color:red;">' + error.toString() + '</p></div></div>';
          });
        }
      });
    });

    // Fallback error handler
    window.addEventListener('error', function(ev) {
      console.error('Global error:', ev.error);
    });
  </script>
</body>
</html>
